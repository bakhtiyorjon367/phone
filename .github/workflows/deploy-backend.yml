name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu # Change this if your EC2 user is different (e.g., ec2-user)
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Go to the project directory on your EC2
            cd /path/to/your/phone_tracker/backend

            # 2. Pull the latest code from GitHub
            git pull origin main

            # 3. Activate virtual environment and install new dependencies
            source venv/bin/activate
            pip install -r requirements.txt

            # 4. Restart the FastAPI service (assuming you use systemd)
            sudo systemctl restart fastapi-phone-tracker.service
